<!DOCTYPE html>
<html>
    <head> 
        <title>CSS Box Model</title> 
        <style>
            .box { 
                width: 320px;
                height: 180px;
                padding: 20px;
                margin: 40px auto;
                border: 4px solid #0284c7;
                border-radius: 12px;
                background-color: #ffffff;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                outline: 2px dashed #38bdf8;
                outline-offset: 4px;
                text-align: center; 
            }
        </style> 
    </head> 
    <body> 
        <h1 align="center">CSS Box Model 
            Demonstration</h1>
        <div class="box"> 
            <h2>Box Model Card</h2> 
            <p>This card demonstrates content, padding, border,
                margin, box-shadow, and outline properties.</p> 
        </div> 
    </body> 
</html>
