<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
</head>
<body>
    <body align="center">
        <h1>HTML Image Example</h1>
        <hr>
        <h3>Single Image</h3>
        <img src="../images/collegeLogo.png" alt="College Image" width="600" height="100" title="MEWA VBS
        College Logo" border="2">
        <hr>
        <h3>Multiple Images</h3>
        <img src="../images/lab.jpeg" alt="Computer Lab" width="200" height="150" title="Computer
        Lab" border="2" align="left">
        <img src="../images/collegeLogo.png" alt="Library" width="200" height="150" title="college logo"
        border="2" align="middle">
        <img src="../images/college.jpeg" alt="Campus" width="200" height="150" title="College
        Campus" border="2" align="right">
</body>
</html>
