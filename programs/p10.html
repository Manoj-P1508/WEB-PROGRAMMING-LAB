<!DOCTYPE html> 
<html> 
<head> 
    <title>CSS Selectors and Styling</title> 
    <style> 
        /* Element Selector */ 
        h1 { color: #1e3a8a; font-family: 'Segoe UI', sans-serif; text-align: center; } 

        /* Class Selector */ 
        .highlight { background-color: #fef08a; padding: 5px; font-weight: bold; } 

        /* ID Selector */ 
        #main-header { border-bottom: 3px solid #2563eb; padding-bottom: 10px; } 

        /* Attribute Selector */ 
        input[type="text"] { border: 2px solid #3b82f6; border-radius: 4px; padding:6px; }

        /* Pseudo-class Hover */ 
        a:hover { color: #dc2626; text-decoration: underline; } 

        /* Background & Font Properties */ 
        body { background-color: #f8fafc; font-size: 16px; line-height: 1.6; } 
    </style> 
</head> 
<body> 
    <h1 id="main-header">CSS Selectors & Styling Showcase</h1> 
    <p class="highlight">This paragraph is styled using a Class Selector with a yellow highlight.</p> 
    <p>Hover over this <a href="#">Hyperlink</a> to test Pseudo-class styling.</p> 
    <div> 
        <label>Attribute Selector Target:</label> 
        <input type="text" placeholder="Type here..."> 
    </div> 
</body> 
</html>
