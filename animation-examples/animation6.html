<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background-color: red;
  position: relative;
  animation-name: opacity;
  animation-duration: 4s;
  animation-iteration-count: infinite;  
  }
@keyframes opacity{
  50%{opacity: 0;}
}

@keyframes rotation { 
100%{
    /* transform:translate(100px); */
     /* transform: rotate(360deg); */
    /* transform: rotateX(360deg); */
    /* transform: rotateY(360deg); */
    transform: rotateZ(360deg);
    /*transform:scale(1.5);
    transform:scaleX(1.5); */
    transition: 3s;
  }
      
}
</style>
</head>
<body>

<h1>CSS animation-direction Property</h1>

<p>The animation-direction property specifies whether an animation should be played forwards, backwards or in alternate cycles. The following example will run the animation in reverse direction (backwards):</p>

<div></div>

</body>
</html>
